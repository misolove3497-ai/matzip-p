<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>맛동여지도 - 미슐랭 & 블루리본 맛집 지도</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 아이콘 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Kakao 지도 JavaScript API (발급받은 키 적용 완료) -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=48a1e905b1455f0b3e3a5b7e3452cae0&libraries=services,clusterer"></script>

  <style>
    /* 커스텀 오버레이 핀 스타일 */
    .custom-overlay {
      position: relative;
      bottom: 48px;
      border-radius: 20px;
      background: #1e293b;
      color: #ffffff;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 2px solid #3b82f6;
      transition: all 0.2s ease;
    }
    .custom-overlay:hover {
      transform: translateY(-3px) scale(1.05);
      background: #0f172a;
    }
    .custom-overlay::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 6px 0;
      border-style: solid;
      border-color: #3b82f6 transparent transparent transparent;
    }
    .custom-overlay.michelin {
      border-color: #ef4444;
      background: #991b1b;
    }
    .custom-overlay.michelin::after {
      border-color: #ef4444 transparent transparent transparent;
    }
    .custom-overlay.blueribbon {
      border-color: #3b82f6;
      background: #1e3a8a;
    }
    .custom-overlay.active {
      background: #f59e0b !important;
      border-color: #fef08a !important;
      color: #000;
      z-index: 99;
    }
    .custom-overlay.active::after {
      border-color: #f59e0b transparent transparent transparent !important;
    }

    /* 스크롤바 커스텀 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased h-screen overflow-hidden flex flex-col">

  <!-- 1. Header (맛동여지도 배너) -->
  <header class="bg-gradient-to-r from-emerald-600 via-teal-600 to-cyan-700 text-white shadow-md z-20 flex-none px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="bg-white/20 p-2 rounded-xl backdrop-blur-md">
        <i class="fa-solid fa-map-location-dot text-2xl text-amber-300"></i>
      </div>
      <div>
        <h1 class="text-xl font-black tracking-tight flex items-center gap-2">
          맛동여지도 <span class="text-xs bg-amber-400 text-slate-900 px-2 py-0.5 rounded-full font-bold">2026 큐레이션</span>
        </h1>
        <p class="text-xs text-emerald-100 hidden sm:block">미슐랭 스타 & 블루리본 검증 맛집을 한눈에 지도에서 확인하세요</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-2 text-xs font-medium">
      <span class="bg-white/10 px-3 py-1.5 rounded-lg border border-white/20 hidden md:inline-block">
        <i class="fa-solid fa-utensils text-amber-300 mr-1"></i> 총 <b id="total-count" class="text-amber-300">0</b>개 맛집
